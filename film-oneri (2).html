<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit { background-color: white; color: black; }
        .btn-back { background-color: #333; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">🎬 Film Önerisi</h2>
    <p style="text-align: center; font-size: 0.8em; color: #888;">Bilgilerini gir ve öneri yap!</p>

    <div class="form-group">
        <label>Ad Soyad</label>
        <input type="text" placeholder="Örnek: Ahmet Yılmaz">
    </div>
    
    <div class="form-group">
        <label>Sınıf</label>
        <input type="text" placeholder="Örnek: 11">
    </div>

    <div class="form-group">
        <label>Şube</label>
        <input type="text" placeholder="Örnek: B">
    </div>

    <div class="form-group">
        <label>Film Adı</label>
        <input type="text" placeholder="Örnek: Inception, Interstellar...">
    </div>

    <div class="form-group">
        <label>Neden öneriyorsun? (İsteğe bağlı)</label>
        <textarea rows="3" placeholder="Kısaca açıkla..."></textarea>
    </div>

    <button class="btn-submit">Öneriyi Gönder ✅</button>
    <button class="btn-back">← Geri Dön</button>
</div>

</body>
</html>
